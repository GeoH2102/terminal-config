# ~/.tmux.conf

# --- Terminal and colours ----------------------------------------------------
# Ghostty sets TERM=xterm-ghostty. tmux itself should advertise
# tmux-256color, with truecolor passed through to whatever's underneath.
set  -g  default-terminal "tmux-256color"
set  -ga terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB,*256col*:RGB"

# Undercurls, and coloured undercurls, for LSP diagnostics.
set  -ga terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set  -ga terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# --- Behaviour ---------------------------------------------------------------
# The single most important line in this file. tmux's default 500ms escape
# delay makes Neovim feel broken every time you press Esc.
set  -sg escape-time 10

set  -g  mouse on
set  -g  focus-events on          # lets Neovim's autoread notice file changes
set  -g  history-limit 50000
set  -g  base-index 1             # windows start at 1, matching the keyboard
setw -g  pane-base-index 1
set  -g  renumber-windows on
set  -g  status-position top
set  -g  set-clipboard on
setw -g  mode-keys vi

# --- Keys --------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Splits that inherit the current directory, with mnemonic keys.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style copy mode: v to select, y to yank.
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# Keep a mouse selection highlighted after the button is released. The default
# is copy-pipe-and-cancel, which copies and then leaves copy mode, so the
# highlight vanishes the moment you let go. This still copies on release; it
# just stays in copy mode, so the selection remains visible until q, Esc, or
# the next drag. It is tmux doing the selecting, so it respects pane borders,
# which Ghostty's own Shift+drag selection does not.
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear

# --- vim-tmux-navigator ------------------------------------------------------
# Ctrl-h/j/k/l moves between panes, unless the current pane is running Neovim,
# in which case the keypress is forwarded so Neovim can move between its own
# splits. The boundary between editor and terminal disappears.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# --- Pane tabs ---------------------------------------------------------------
# prefix + Tab swaps the current pane with a hidden partner pane, giving one
# pane slot two tabs: Claude and a shell, say. The first press creates the
# partner. See ~/.local/bin/tmux-pane-tab.
# The pane id is passed explicitly: run-shell does not set TMUX_PANE, but tmux
# does expand formats in the command string.
bind Tab run-shell "~/.local/bin/tmux-pane-tab toggle #{pane_id}"

# When a parked shell exits, its pane goes with it and the partner's marker
# would keep claiming a tab that is gone. A format cannot test whether a pane
# id is live, so clear stale pairings on every pane exit. The hook reports the
# active pane rather than the dying one, so sweep checks all of them.
set-hook -g pane-exited 'run-shell "~/.local/bin/tmux-pane-tab sweep"'

# --- Sessions ----------------------------------------------------------------
# prefix + s opens sesh: existing tmux sessions, zoxide directories, and any
# configured projects in one fuzzy list. Creating a session from it runs
# tmux-dev-layout, so you get the same panes as the `dev` shell function.
# prefix + S keeps tmux's built-in session tree.
bind s display-popup -E -w 70% -h 60% "~/.local/bin/tmux-sesh-picker"
bind S choose-tree -Zs

# prefix + / searches Claude Code conversation transcripts.
#
# Copy mode cannot do this. Claude Code runs in the alternate screen, so its
# pane has no scrollback at all: `tmux display -p '#{history_size}'` on it
# reports 0, and `prefix + [` then `/` only ever searches the screenful in
# front of you. claude-search reads the JSONL under ~/.claude/projects/
# instead, which holds the whole conversation.
#
# -d starts the popup in the pane's own directory, because claude-search picks
# its transcripts from the working directory. Wider and taller than the session
# picker since results come with a preview pane.
bind / display-popup -E -d "#{pane_current_path}" -w 90% -h 80% "~/.local/bin/claude-search"

# prefix + X kills the whole session, matching tmux's own prefix + x for a pane
# and prefix + & for a window.
#
# The switch-client comes first on purpose: kill-session detaches every client
# attached to the session rather than moving them, so on its own this would
# drop you to your shell even with other sessions running. When this is the
# only session, switch-client is a harmless no-op and you get the detach you
# wanted anyway.
bind X confirm-before -p "kill session '#S'? (y/n)" "run-shell 'tmux switch-client -n; tmux kill-session -t \"#{session_name}\"'"

# Resize with prefix + H/J/K/L, repeatable.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Status line (everforest) ------------------------------------------------
# bg=default everywhere, so Ghostty's transparency passes through rather than
# tmux painting over it.
set -g status-style "bg=default fg=#859289"
set -g status-left "#[fg=#a7c080,bold] #S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=#7a8478]#{battery_icon_charge} #{battery_percentage} #[fg=#3d484d]| #[fg=#7a8478]%H:%M "
set -g status-right-length 40
setw -g window-status-current-style "fg=#d3c6aa,bold"
setw -g window-status-style "fg=#7a8478"
# The _stash window holds hidden pane tabs, so keep it out of the window list.
# This has to be a conditional in the global format: setting
# window-status-format per window leaks to the other windows.
setw -g window-status-format "#{?#{==:#{window_name},_stash},, #I:#W }"
setw -g window-status-current-format "#{?#{==:#{window_name},_stash},, #I:#W }"
set -g pane-border-style "fg=#3d484d"
set -g pane-active-border-style "fg=#a7c080"

# Rounded pane frames are not available: pane-border-lines takes only single,
# double, heavy, simple or number. tmux draws ONE shared border between
# neighbouring panes, meeting at ┼ ┬ ├ junctions, so there are no per-pane
# corners to round. Zellij gives each pane its own complete frame, which is
# what lets it use ╭ ╮ ╰ ╯.
#
# pane-border-indicators is left at its default. "both" adds arrow markers to
# the active pane's border; tried and removed, since they add a glyph without
# making the active pane any easier to find.
#
# Dim the TEXT of inactive panes, not just their one-character border. A whole
# block of dimmer text reads peripherally in a way a thin line does not.
#
# Foreground only, deliberately. Ghostty runs at background-opacity 0.3 and
# everforest at transparent_background_level 2, so panes have no background of
# their own; setting a bg here would paint over the glass effect.
set -g window-style "fg=#859289"
set -g window-active-style "fg=#d3c6aa"

# A title line in each pane's top border, showing what the pane is running. The
# leading marker appears when the pane has a hidden tab, driven by the same
# @tab-partner option that prefix + Tab sets, so it updates itself on every
# swap. This costs one row: the top pair of panes lose a line, the bottom pane
# reuses the border it already had.
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#a7c080],#[fg=#7a8478]}#{?#{!=:#{@tab-partner},},⇥ ,}#{pane_current_command} "
set -g message-style "bg=#272e33 fg=#d3c6aa"

# --- Plugins -----------------------------------------------------------------
# tmux-fingers: prefix + F labels every path, hash, URL, and number on screen
# with a letter. Press the letter to copy it. Installed via Homebrew, so it
# needs no plugin manager.
run 'tmux-fingers load-config'
set -g @fingers-key F
set -g @fingers-main-action :copy:
set -g @fingers-ctrl-action ":open:"

# Everything else goes through TPM. prefix + I installs, prefix + U updates.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-battery'

set -g @batt_icon_charge_tier8 '#[fg=#a7c080]'
set -g @batt_icon_charge_tier4 '#[fg=#dbbc7f]'
set -g @batt_icon_charge_tier1 '#[fg=#e67e80]'

# Keep this last: TPM has to run after every @plugin line.
run '~/.tmux/plugins/tpm/tpm'
